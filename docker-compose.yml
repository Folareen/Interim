services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: interim
      POSTGRES_PASSWORD: interim
      POSTGRES_DB: interim
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: interim
      MINIO_ROOT_PASSWORD: interim-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  minio-init:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 interim interim-secret; do sleep 1; done;
      mc mb --ignore-existing local/interim"
volumes:
  pgdata:
  miniodata:
